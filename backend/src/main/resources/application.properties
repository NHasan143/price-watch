spring.application.name=pricewatch
# Local secrets (Clerk keys) live in backend/.env, which git ignores; see backend/.env.example.
# Both paths: VS Code starts the app from the repository root, mvn from backend/.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=8080

# --- Database: embedded H2 stored on disk in backend/data (survives restarts) ---
spring.datasource.url=jdbc:h2:file:./data/pricewatch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- PriceWatch settings ---
# How often every tracked product is re-checked (Spring cron: sec min hour day month weekday).
# Default: every 12 hours (00:00 and 12:00 server time). Use "0 */5 * * * *" for every 5 minutes while developing.
pricewatch.scheduler.enabled=true
pricewatch.scheduler.cron=0 0 */12 * * *
pricewatch.scheduler.delay-between-requests-ms=1500
# A check that fails for a temporary reason (timeout, server error, rate limit) is tried again sooner than the
# regular schedule, waiting twice as long each time: 15, 30, 60, 120 minutes. Blocked shops are not retried early.
pricewatch.scheduler.retry.first-delay-minutes=15
pricewatch.scheduler.retry.max-retries=4

# HTTP settings used when downloading product pages.
pricewatch.scraper.timeout-ms=10000
# Quick retries inside one check for timeouts, network errors, HTTP 429 and 5xx: 1 s, then 2 s (capped at 8 s).
pricewatch.scraper.retry.max-attempts=3
pricewatch.scraper.retry.initial-backoff-ms=1000
pricewatch.scraper.retry.max-backoff-ms=8000
pricewatch.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36

# Headless Chrome fallback for pages that build their price with JavaScript or block plain requests.
# Uses the installed Chrome, or downloads one on first use. Set enabled=false to turn it off.
pricewatch.renderer.enabled=true
pricewatch.renderer.timeout-ms=30000


# Origins allowed to call /api/** directly (the Vite dev server uses a proxy, so this is only
# needed if the frontend is hosted somewhere else).
pricewatch.cors.allowed-origins=http://localhost:5173

# --- Accounts (Clerk) ---
# Visitors can add products as guests: each is read once, not re-checked, and sends no alerts. Signing up keeps them
# tracked, with alerts to the account's email. Without CLERK_ISSUER accounts are off and everyone is a guest.
# Create an application at https://dashboard.clerk.com, then set:
#   CLERK_ISSUER       your Frontend API URL (Dashboard > Configure > API keys > "Frontend API URL"),
#                      for example https://your-app.clerk.accounts.dev
#   CLERK_SECRET_KEY   sk_test_... (used only to look up account emails for alerts; never sent to the browser)
# and VITE_CLERK_PUBLISHABLE_KEY (pk_test_...) for the frontend, in frontend/.env.local.
pricewatch.auth.clerk.issuer=${CLERK_ISSUER:}
pricewatch.auth.clerk.secret-key=${CLERK_SECRET_KEY:}
# Origins the app is opened from; Clerk tokens minted for other sites are refused.
pricewatch.auth.clerk.authorized-parties=http://localhost:5173
# Guests can add this many products; unclaimed guest products are removed after keep-days.
pricewatch.guest.max-products=10
pricewatch.guest.keep-days=7

# --- Email alerts (optional) ---
# Alerts go to the email of the product's owner. Without spring.mail.* they are only written to the log.
# pricewatch.alert.to is the fallback for owners whose email is not known yet.
pricewatch.alert.to=
pricewatch.alert.from=pricewatch@localhost
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.pricewatch=INFO
# Selenium warns when Chrome is newer than its DevTools bindings; PriceWatch does not use DevTools.
logging.level.org.openqa.selenium.devtools=ERROR
logging.level.org.openqa.selenium.chromium=ERROR
