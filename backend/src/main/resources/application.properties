spring.application.name=pricewatch
server.port=8080

# --- Database: embedded H2 stored on disk in backend/data (survives restarts) ---
spring.datasource.url=jdbc:h2:file:./data/pricewatch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- PriceWatch settings ---
# How often every tracked product is re-checked (Spring cron: sec min hour day month weekday).
# Default: every 6 hours. Use "0 */5 * * * *" for every 5 minutes while developing.
pricewatch.scheduler.enabled=true
pricewatch.scheduler.cron=0 0 */6 * * *
pricewatch.scheduler.delay-between-requests-ms=1500

# HTTP settings used when downloading product pages.
pricewatch.scraper.timeout-ms=10000
pricewatch.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36


# Origins allowed to call /api/** directly (the Vite dev server uses a proxy, so this is only
# needed if the frontend is hosted somewhere else).
pricewatch.cors.allowed-origins=http://localhost:5173

# --- Email alerts (optional) ---
# Without these, price drops are only written to the log.
pricewatch.alert.to=
pricewatch.alert.from=pricewatch@localhost
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.pricewatch=INFO
